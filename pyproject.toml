[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trabajo-data-mining-tools"
version = "0.1.0"
description = "Herramientas de data mining para carga, limpieza, exploración, modelado y evaluación."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aaron Alvaro Felices Vallejos" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
